services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auditor}
      POSTGRES_DB: ${POSTGRES_DB:-auditor}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auditor} -d ${POSTGRES_DB:-auditor}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-auditor}:${POSTGRES_PASSWORD:-auditor}@db:5432/${POSTGRES_DB:-auditor}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      LOCAL_FIXTURE_ORIGINS: http://127.0.0.1:8000
    depends_on: { db: { condition: service_healthy } }
    volumes: [screenshots:/data/screenshots]
    ports: ["127.0.0.1:8000:8000"]
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: { backend: { condition: service_healthy } }
    ports: ["127.0.0.1:8080:80"]
volumes:
  pgdata:
  screenshots:
